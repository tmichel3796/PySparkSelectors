[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PySpark_Column_Selectors"
version = "0.1.3"
description = "Adds column selector functionality to pyspark"
readme = "README.md"
authors = [
  {name = "Trevor A. Michel", email = "Info@TrevorMichel.com"}
]
maintainers = [
  {name = "Trevor A. Michel", email = "Info@TrevorMichel.com"}
]
classifiers = [
    "Typing :: Typed",
    # TODO: Add additional classifiers as needed
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "typing-extensions",
  "pyspark",
]
requires-python = ">= 3.10"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
    "typing-extensions",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/tmichel3796/PySparkSelectors/issues"
changelog = "https://github.com/tmichel3796/PySparkSelectors/releases"
documentation = "https://tmichel3796.github.io/PySparkSelectors/"
homepage = "https://github.com/tmichel3796/PySparkSelectors"

[project.scripts]
PySparkSelectors = "PySparkSelectors.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["./src/PySparkSelectors"]
